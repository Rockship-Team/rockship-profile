name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME || github.event.repository.name }}
  # --bun forces the Bun runtime to execute Next itself; a plain `bun run` would
  # hand off to Node via Next's shebang. Override with the VERCEL_BUILD_COMMAND
  # secret to fall back to `bun run build` without a code change.
  VERCEL_BUILD_COMMAND: ${{ secrets.VERCEL_BUILD_COMMAND || 'bun --bun run build' }}
  VERCEL_FRAMEWORK: ${{ secrets.VERCEL_FRAMEWORK || 'nextjs' }}
  VERCEL_OUTPUT_DIR: ${{ secrets.VERCEL_OUTPUT_DIR || '.next' }}
  CI_COMMIT_REF_NAME: ${{ github.ref_name }}

jobs:
  # Deploy to Vercel Preview (for PRs and non-main branches)
  deploy_preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    # The Vercel CLI is a build tool, not a project dependency, so it is
    # installed globally rather than added to package.json.
    - name: Install Vercel CLI
      run: bun install -g vercel

    - name: Deploy to Vercel Preview
      run: |
        chmod +x .github/scripts/deploy-vercel.sh
        .github/scripts/deploy-vercel.sh preview
      env:
        # Application environment variables
        NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }}
        NEXT_PUBLIC_RESEND_API_KEY: ${{ secrets.NEXT_PUBLIC_RESEND_API_KEY }}

  # Deploy to Production (main branch only)
  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version

    # The Vercel CLI is a build tool, not a project dependency, so it is
    # installed globally rather than added to package.json.
    - name: Install Vercel CLI
      run: bun install -g vercel

    - name: Deploy to Vercel Production
      run: |
        chmod +x .github/scripts/deploy-vercel.sh
        .github/scripts/deploy-vercel.sh production
      env:
        # Application environment variables
        NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }}
        NEXT_PUBLIC_RESEND_API_KEY: ${{ secrets.NEXT_PUBLIC_RESEND_API_KEY }}
        # GA4. Production only — deliberately absent from the preview job, so
        # preview deploys do not report into production numbers. A measurement
        # ID is not a secret (it is readable in the page source of any site
        # using it), so the property's ID is committed as the default; set the
        # repository secret to point a deploy at a different property.
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID || 'G-J3SEQ1RW1S' }}

