# Builds the Next.js standalone bundle on the runner with bun, packages it into
# a multi-arch Docker image, pushes to the DigitalOcean container registry, and
# swaps the container on the server over SSH.
#
# This reuses ./scripts/deploy.sh rather than reimplementing the steps, so CI
# and a local `bun run deploy` cannot drift apart. The workflow's only job is to
# synthesise deploy.config from repo variables and hand off.
#
# Setup: docs/deployment.md ("Deploying from GitHub Actions").

name: Deploy

on:
  # Fires on every merge into main — merge commit, squash or rebase all arrive
  # as a push to the branch. Also fires on a direct push to main; to deploy only
  # merged pull requests, swap this for:
  #   pull_request:
  #     types: [closed]
  #     branches: [main]
  # and gate the job with: if: github.event.pull_request.merged == true
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing registry tag to release (rollback). Leave empty to build this commit."
        required: false
        type: string

# Never let two deploys race for the same container. Deploys are not cancelled
# mid-flight — that could leave the server with no running container.
concurrency:
  group: deploy-ecr
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push and release
    # Self-hosted runner. Unlike a GitHub-hosted VM this box persists between
    # jobs, so nothing here may write to shared locations (~/.ssh, ~/.aws) or
    # assume a clean workspace.
    runs-on: self-hosted
    environment: production

    permissions:
      contents: read

    env:
      # Explicit so scripts/deploy.sh does not derive it from git state.
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}
      # Read by scripts/deploy.sh as overrides of deploy.config, so the token is
      # never written to a file in the workspace.
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # bun runs both the install and the Next build, so no Node setup is needed.
      # The version comes from .bun-version — older bun cannot run the build.
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Check registry credentials are present
        run: |
          if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::REGISTRY_USER and/or REGISTRY_TOKEN secrets are not set. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # `docker login` stores the token in $DOCKER_CONFIG/config.json. The
      # default ~/.docker is shared by every job on this self-hosted runner, so
      # point it at the per-job RUNNER_TEMP instead. Must run before buildx setup.
      - name: Use a job-scoped Docker config
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: env.ROLLBACK != 'true'
        uses: docker/setup-qemu-action@v4 # arm64 emulation for the multi-arch build

      - name: Set up Docker Buildx
        if: env.ROLLBACK != 'true'
        uses: docker/setup-buildx-action@v4

      # Values arrive as env vars rather than being pasted into the script text,
      # so a value containing $(...) or a quote cannot alter the commands here.
      # printf %q emits shell-safe literals, and deploy.config is sourced by bash.
      - name: Write deploy.config
        env:
          CFG_REGISTRY: ${{ vars.REGISTRY }}
          CFG_IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          CFG_PLATFORMS: ${{ vars.PLATFORMS }}
          CFG_SSH_HOST: ${{ vars.SSH_HOST }}
          CFG_SSH_USER: ${{ vars.SSH_USER }}
          CFG_SSH_PORT: ${{ vars.SSH_PORT }}
          CFG_CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
          CFG_DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
          CFG_HOST_PORT: ${{ vars.HOST_PORT }}
          CFG_CONTAINER_PORT: ${{ vars.CONTAINER_PORT }}
          CFG_REMOTE_ENV_FILE: ${{ vars.REMOTE_ENV_FILE }}
        run: |
          # Fail here with a readable message rather than deep inside the script.
          : "${CFG_REGISTRY:?set the REGISTRY repository variable}"
          : "${CFG_SSH_HOST:?set the SSH_HOST repository variable}"
          : "${CFG_SSH_USER:?set the SSH_USER repository variable}"
          : "${CFG_REMOTE_ENV_FILE:?set the REMOTE_ENV_FILE repository variable}"

          {
            printf 'REGISTRY=%q\n'        "$CFG_REGISTRY"
            printf 'IMAGE_NAME=%q\n'      "${CFG_IMAGE_NAME:-rockship-profile}"
            printf 'PLATFORMS=%q\n'       "${CFG_PLATFORMS:-linux/amd64,linux/arm64}"
            printf 'SSH_HOST=%q\n'        "$CFG_SSH_HOST"
            printf 'SSH_USER=%q\n'        "$CFG_SSH_USER"
            printf 'SSH_PORT=%q\n'        "${CFG_SSH_PORT:-22}"
            printf 'SSH_KEY=%q\n'         "$RUNNER_TEMP/deploy_key"
            printf 'SSH_KNOWN_HOSTS_FILE=%q\n' "$RUNNER_TEMP/known_hosts"
            printf 'CONTAINER_NAME=%q\n'  "${CFG_CONTAINER_NAME:-rockship-profile}"
            printf 'DOCKER_NETWORK=%q\n'  "${CFG_DOCKER_NETWORK:-nginx}"
            printf 'CONTAINER_PORT=%q\n'  "${CFG_CONTAINER_PORT:-3000}"
            printf 'REMOTE_ENV_FILE=%q\n' "$CFG_REMOTE_ENV_FILE"
            # Normally empty: the host's port 3000 belongs to another app, so the
            # container is reached over DOCKER_NETWORK instead of a published port.
            printf 'HOST_PORT=%q\n'       "${CFG_HOST_PORT:-}"
          } > deploy.config
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set."
            exit 1
          fi

          # Everything lands in RUNNER_TEMP, which is per-job and wiped by the
          # runner. Writing to the shared ~/.ssh would leak the key to other
          # jobs on this machine and let concurrent runs clobber each other.
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

          # A passphrase-protected key cannot prompt here — there is no tty — and
          # ssh reports that as a bare "Permission denied (publickey)". Unlock it
          # into a job-scoped agent instead. The askpass helper reads the
          # passphrase from its environment, so the secret never lands on disk
          # or in any process's argv. It answers only once: on a wrong passphrase
          # ssh-add re-asks forever, which would hang the job instead of failing.
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            sock="$RUNNER_TEMP/ssh-agent.sock"
            eval "$(ssh-agent -s -a "$sock")" > /dev/null

            askpass="$RUNNER_TEMP/askpass.sh"
            cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          [ -e "$0.used" ] && exit 1
          : > "$0.used"
          printf '%s\n' "$SSH_KEY_PASSPHRASE"
          ASKPASS
            chmod 700 "$askpass"

            if ! SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=none \
                ssh-add "$RUNNER_TEMP/deploy_key" < /dev/null 2> /dev/null; then
              echo "::error::Could not unlock SSH_PRIVATE_KEY with SSH_KEY_PASSPHRASE."
              ssh-agent -k > /dev/null
              exit 1
            fi
            rm -f "$askpass" "$askpass.used"

            # deploy.sh passes `-i deploy_key -o IdentitiesOnly=yes`; ssh matches
            # the agent's key to it through this public half.
            ssh-add -L > "$RUNNER_TEMP/deploy_key.pub"

            # Later steps need the agent too.
            echo "SSH_AUTH_SOCK=$sock" >> "$GITHUB_ENV"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set; trusting the host key on first use (vulnerable to MITM). Populate it with: ssh-keyscan -p ${SSH_PORT:-22} $SSH_HOST"
            ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          fi
          chmod 600 "$RUNNER_TEMP/known_hosts"

      # NEXT_PUBLIC_* is inlined by `next build`, so the GA measurement ID has to
      # exist on this runner at build time — setting it on the server is too late,
      # the value is already compiled into the bundle. Next loads .env.production
      # automatically, and scripts/deploy.sh build reads it too, so write it there
      # before the build. Not a secret (it is readable in the page source of any
      # site using it): the property's ID is the committed default, overridable
      # with the NEXT_PUBLIC_GA_MEASUREMENT_ID repo variable to point a build at a
      # different property. Mirrors the Vercel pipeline in ci-cd.yml.
      - name: Write build-time public env
        if: env.ROLLBACK != 'true'
        env:
          GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || 'G-J3SEQ1RW1S' }}
        run: |
          printf 'NEXT_PUBLIC_GA_MEASUREMENT_ID=%s\n' "$GA_MEASUREMENT_ID" >> .env.production

      - name: Build Next.js standalone bundle
        if: env.ROLLBACK != 'true'
        run: ./scripts/deploy.sh build

      - name: Build multi-arch image and push to registry
        if: env.ROLLBACK != 'true'
        run: ./scripts/deploy.sh push

      - name: Release on server
        run: ./scripts/deploy.sh release

      - name: Summary
        if: always()
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
          DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
          CONTAINER_PORT: ${{ vars.CONTAINER_PORT }}
          HOST_PORT: ${{ vars.HOST_PORT }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -n "$HOST_PORT" ]; then
            reachable="http://${SSH_HOST}:${HOST_PORT}"
          else
            reachable="${DOCKER_NETWORK:-nginx} network → ${CONTAINER_NAME:-rockship-profile}:${CONTAINER_PORT:-3000}"
          fi

          if [ "$ROLLBACK" = 'true' ]; then
            mode='rollback (no rebuild)'
          else
            mode='build from commit'
          fi

          {
            echo "### Deploy $JOB_STATUS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Mode | $mode |"
            echo "| Server | \`$SSH_HOST\` |"
            echo "| Reachable at | \`$reachable\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up credentials
        if: always()
        run: |
          # Never remove ~/.ssh/* here: on a self-hosted runner that directory is
          # shared with every other job on the machine.
          # The agent outlives its step, so stop it explicitly.
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k > /dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_key.pub" \
                "$RUNNER_TEMP/known_hosts" \
                "$RUNNER_TEMP/askpass.sh" "$RUNNER_TEMP/askpass.sh.used" \
                "$RUNNER_TEMP/ssh-agent.sock"
          rm -rf "$RUNNER_TEMP/docker"
          rm -f deploy.config .env.production
